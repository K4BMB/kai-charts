<header class="topbar">
  <div>
    <h1>kai-charts <span class="tag">Angular</span></h1>
    <p>Gráficos SVG para Angular 20+ · sin dependencias · colores por tokens CSS</p>
  </div>
  <nav class="nav" aria-label="Secciones">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
      >Vitrina</a
    >
    <a routerLink="/playground" routerLinkActive="active">Playground</a>
    <a href="../react/">Demo React</a>
    <a href="https://github.com/K4BMB/kai-charts" target="_blank" rel="noopener">GitHub</a>
  </nav>
  <label class="theme">
    Tema
    <select [value]="theme()" (change)="setTheme($event)">
      <option value="light">Claro</option>
      <option value="dark">Oscuro</option>
      <option value="brand">Marca</option>
    </select>
  </label>
</header>

<router-outlet />
