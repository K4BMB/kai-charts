<nav class="chart-picker" aria-label="Gráfico">
  @for (c of charts; track c.id) {
    <a
      class="chip"
      [class.chip--active]="c.id === active()"
      [href]="'#/playground/' + c.id"
      [attr.aria-current]="c.id === active() ? 'page' : null"
      >{{ c.label }}</a
    >
  }
</nav>

@switch (active()) {
  @case ('line') {
    <app-line-sandbox />
  }
  @case ('ring') {
    <app-ring-sandbox />
  }
  @case ('kpi') {
    <app-kpi-sandbox />
  }
  @case ('progress') {
    <app-progress-sandbox />
  }
  @case ('ranking') {
    <app-ranking-sandbox />
  }
  @case ('table') {
    <app-table-sandbox />
  }
  @case ('calendar') {
    <app-calendar-sandbox />
  }
  @case ('map') {
    <app-map-sandbox />
  }
  @default {
    <app-bar-sandbox />
  }
}
