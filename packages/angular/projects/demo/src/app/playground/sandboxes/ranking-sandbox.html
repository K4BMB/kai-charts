<div class="play">
  <aside class="panel">
    <section>
      <h2>Datos</h2>
      <app-rows-editor [columns]="columns" [(rows)]="rows" [json]="items()" />
    </section>

    <section>
      <h2>Opciones</h2>
      <div class="options">
        <label class="field">
          Top N (limit)
          <input
            type="number"
            min="1"
            step="1"
            placeholder="Todos"
            [value]="limit() ?? ''"
            (input)="setOptionalNumber(limit, $event)"
          />
        </label>
        <label class="field">
          Orden (sort)
          <select [value]="sort()" (change)="sort.set($any(text($event)))">
            <option value="desc">Descendente</option>
            <option value="asc">Ascendente</option>
            <option value="none">Sin ordenar</option>
          </select>
        </label>
        <label class="check"
          ><input type="checkbox" [checked]="showBars()" (change)="showBars.set(!showBars())" />
          Barras</label
        >
        <label class="check"
          ><input type="checkbox" [checked]="showRank()" (change)="showRank.set(!showRank())" />
          Posición</label
        >
        <label class="check"
          ><input type="checkbox" [checked]="loading()" (change)="loading.set(!loading())" />
          Cargando</label
        >
        <label class="check"
          ><input type="checkbox" [checked]="empty()" (change)="empty.set(!empty())" /> Sin
          datos</label
        >
        <label class="field wide">
          Etiqueta accesible (label)
          <input type="text" [value]="label()" (input)="label.set(text($event))" />
        </label>
        <app-format-fields [(locale)]="locale" [(format)]="format" />
      </div>
    </section>

    <section>
      <h2>Código</h2>
      <app-code-box [code]="code()" />
    </section>
  </aside>

  <div class="stage">
    <div class="card">
      <kc-ranking-list
        [items]="chartItems()"
        [limit]="limit()"
        [sort]="sort()"
        [showBars]="showBars()"
        [showRank]="showRank()"
        [loading]="loading()"
        [label]="label()"
        [locale]="locale()"
        [valueFormat]="valueFormat()"
        (itemClick)="onItemClick($event)"
      />
    </div>
    <p class="status" aria-live="polite" appStatus [event]="lastEvent()">
      Edita las filas del panel y el ranking se reordena al instante. Clic en una fila para ver
      <code>itemClick</code>.
    </p>
  </div>
</div>
