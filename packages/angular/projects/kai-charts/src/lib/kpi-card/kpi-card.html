@if (hasIcon()) {
  <div class="kc-kpi__icon" aria-hidden="true">
    <ng-content select="[kcIcon]" />
  </div>
}
<div class="kc-kpi__body">
  @if (loading()) {
    <div class="kc-kpi__label">&nbsp;</div>
    <div class="kc-kpi__value">&nbsp;</div>
    <div class="kc-kpi__meta">&nbsp;</div>
  } @else {
    <div class="kc-kpi__label">{{ label() }}</div>
    <div class="kc-kpi__value">{{ valueText() }}</div>
    @if (hasMeta()) {
      <div class="kc-kpi__meta">
        @if (trendView(); as t) {
          <kc-trend-chip [trend]="t" />
        }
        @if (subtext(); as text) {
          <span class="kc-kpi__subtext">{{ text }}</span>
        }
      </div>
    }
  }
</div>
